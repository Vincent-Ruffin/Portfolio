<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview - Nouvelle Navigation et Hero</title>
    <style>
      /* ===== VARIABLES CSS ===== */
      :root {
        /* Couleurs */
        --color-primary: #0f172a; /* Noir profond */
        --color-accent: #5d8aa8; /* Bleu accent */
        --color-text: #1f2937; /* Gris foncé texte */
        --color-bg: #ffffff; /* Blanc */
        --color-border: #e5e7eb; /* Gris très clair */
        --color-muted: #9ca3af; /* Gris moyen */

        /* Espacements */
        --spacing-xs: 0.5rem;
        --spacing-sm: 1rem;
        --spacing-md: 1.5rem;
        --spacing-lg: 2rem;
        --spacing-xl: 3rem;
        --spacing-2xl: 4rem;

        /* Typographie */
        --font-sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          "Helvetica Neue", sans-serif;

        /* Border radius */
        --radius-sm: 0.375rem;
        --radius-md: 0.5rem;
        --radius-lg: 1rem;

        /* Ombres */
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md:
          0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --shadow-lg:
          0 10px 15px -3px rgba(0, 0, 0, 0.1),
          0 4px 6px -2px rgba(0, 0, 0, 0.05);

        /* Transitions */
        --transition-fast: 0.15s ease;
        --transition-base: 0.3s ease;
        --transition-slow: 0.5s ease;
      }

      * {
        box-sizing: border-box;
      }

      html {
        font-size: 16px;
      }

      body {
        margin: 0;
        background-color: var(--color-bg);
        font-family: var(--font-sans);
      }

      /* ===== NAVBAR ===== */
      nav {
        position: fixed;
        z-index: 99;
        top: 0;
        width: 100%;
        height: auto;
        padding: var(--spacing-md) 0;

        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);

        transition: all var(--transition-base);
      }

      nav > div {
        display: flex;
        justify-content: space-between;
        align-items: center;

        max-width: 1280px;
        margin: 0 auto;
        padding: 0 var(--spacing-xl);
      }

      #title {
        font-family: var(--font-sans);
        font-weight: 600;
        font-size: 1.375rem;
        letter-spacing: -0.02em;
        color: var(--color-primary);

        cursor: default;
        white-space: nowrap;
        transition: color var(--transition-fast);
      }

      .bold {
        font-weight: 700;
      }

      #title > .bold {
        color: var(--color-accent);
        transition: color var(--transition-fast);
      }

      .menu {
        display: flex;
        align-items: center;
        gap: var(--spacing-lg);
      }

      .menu > a {
        display: inline-block;
        position: relative;

        font-family: var(--font-sans);
        font-weight: 500;
        font-size: 0.95rem;
        color: var(--color-text);
        text-decoration: none;
        white-space: nowrap;

        padding: var(--spacing-sm) 0;
        transition: color var(--transition-fast);
      }

      .menu > a:before {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0;
        height: 2px;
        background: var(--color-accent);
        transition: width var(--transition-fast);
      }

      .menu > a:hover,
      .menu > a.current {
        color: var(--color-accent);
      }

      .menu > a:hover:before,
      .menu > a.current:before {
        width: 100%;
      }

      /* ===== HERO SECTION (HOME) ===== */
      #home {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        background: linear-gradient(135deg, #ffffff 0%, #f9fafb 100%);
        padding-top: 6rem;
        overflow: hidden;
      }

      #home > div {
        max-width: 900px;
        width: 100%;
        margin: 0 auto;
        padding: 0 var(--spacing-xl);
      }

      .homePres {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-2xl);

        text-align: center;
      }

      .homePres > img {
        width: 280px;
        height: 350px;
        object-fit: cover;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);

        animation: fadeInScale 0.6s ease 0.2s both;
      }

      .name,
      .student,
      .developer {
        margin: 0;
        color: var(--color-primary);
      }

      .name {
        font-family: var(--font-sans);
        font-weight: 700;
        font-size: 3.5rem;
        letter-spacing: -0.02em;
        line-height: 1.1;

        animation: fadeInUp 0.6s ease 0.3s both;
      }

      .student {
        font-family: var(--font-sans);
        font-weight: 500;
        font-size: 1.25rem;
        color: var(--color-muted);
        letter-spacing: 0.05em;
        text-transform: uppercase;

        animation: fadeInUp 0.6s ease 0.4s both;
      }

      .developer {
        font-family: var(--font-sans);
        font-weight: 400;
        font-size: 1.125rem;
        color: var(--color-muted);
        line-height: 1.6;
        max-width: 500px;

        animation: fadeInUp 0.6s ease 0.5s both;
      }

      .scrollDown {
        position: absolute;
        bottom: var(--spacing-2xl);

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--spacing-sm);

        cursor: pointer;
        animation: pulse 2s ease infinite;
      }

      .scrollDown svg {
        width: 24px;
        height: 24px;
        opacity: 0.6;
        transition: opacity var(--transition-fast);
      }

      .scrollDown:hover svg {
        opacity: 1;
      }

      @keyframes fadeInScale {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div>
        <div id="title">Vincent<span class="bold">Ruffin</span></div>
        <div class="menu">
          <a href="#home" class="current">Accueil</a>
          <a href="#about">À propos</a>
          <a href="#skills">Compétences</a>
          <a href="#portfolio">Portfolio</a>
          <a href="#contact">Contact</a>
        </div>
      </div>
    </nav>

    <header id="home">
      <div>
        <div class="homePres">
          <!-- Placeholder pour image -->
          <div
            style="
              width: 280px;
              height: 350px;
              background: linear-gradient(135deg, #e5e7eb 0%, #d1d5db 100%);
              border-radius: 8px;
              display: flex;
              align-items: center;
              justify-content: center;
              color: #9ca3af;
              font-size: 14px;
            "
          >
            Photo (280x350)
          </div>
          <div>
            <p class="name">Vincent Ruffin</p>
            <p class="student">Chef de projet<br />en communication digitale</p>
            <p class="developer">
              Création de médias digitaux • Communication digitale
            </p>
          </div>
        </div>
      </div>
      <a href="#about" class="scrollDown" title="Descendre">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M12 5v14M19 12l-7 7-7-7" />
        </svg>
      </a>
    </header>
  </body>
</html>
